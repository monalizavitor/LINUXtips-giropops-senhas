# =============================================================================
# CI/CD Pipeline for Giropops Senhas Application
# =============================================================================
# This workflow automates the build, push, and deployment process to DigitalOcean Kubernetes
#
# Pipeline Flow:
# 1. Build and Push Job: Builds Docker image and pushes to Docker Hub
# 2. Deploy Job: Deploys the application to Kubernetes using Helm
# =============================================================================

name: Deploy to DigitalOcean Kubernetes

# Trigger conditions: When code is pushed to main/release branches OR manually via workflow_dispatch
on:
  push:
    branches:
      - main      # Production branch
      - release   # Release candidate branch
  workflow_dispatch:  # Allows manual trigger from GitHub Actions UI

# Global environment variables accessible to all jobs
env:
  DOCKER_IMAGE: dissipar/giropops-senhas  # Docker Hub repository name
  HELM_CHART_PATH: ./helm                  # Path to Helm chart directory
  CLUSTER_NAME: giropops-senhas-cluster    # DigitalOcean Kubernetes cluster name

jobs:
  # provision-infrastructure:
  #   runs-on: ubuntu-latest
