name: Deploy to DigitalOcean Kubernetes

on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:

env:
  DOCKER_IMAGE: dissipar/giropops-senhas
  HELM_CHART_PATH: ./helm
  CLUSTER_NAME: giropops-senhas-cluster

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ env.CLUSTER_NAME }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Create Docker registry secret
        run: |
          kubectl create namespace giropops-senhas --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry dockerhub-secret \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username=${{ secrets.DOCKER_USERNAME }} \
            --docker-password=${{ secrets.DOCKER_PASSWORD }} \
            --namespace=giropops-senhas \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Get image tag
        id: image_tag
        run: |
          IMAGE_TAG=$(echo "${{ needs.build-and-push.outputs.image_tag }}" | head -n1)
          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Deploy with Helm
        run: |
          helm upgrade --install giropops-senhas ${{ env.HELM_CHART_PATH }} \
            --set deployments.giropops-senhas.image=${{ steps.image_tag.outputs.tag }} \
            --namespace giropops-senhas \
            --create-namespace \
            --wait \
            --timeout 5m

      - name: Verify deployment
        run: |
          kubectl get pods -n giropops-senhas
          kubectl get svc -n giropops-senhas
