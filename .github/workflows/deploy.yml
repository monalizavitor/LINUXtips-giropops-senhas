name: Deploy to DigitalOcean Kubernetes

on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:

env:
  DOCKER_IMAGE: dissipar/giropops-senhas
  HELM_CHART_PATH: ../helm
  CLUSTER_NAME: giropops-senhas-cluster

jobs:
  provision-infrastructure:
    runs-on: ubuntu-latest
    outputs:
      cluster_id: ${{ steps.terraform.outputs.cluster_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Cache Terraform state
        uses: actions/cache@v3
        with:
          path: terraform/terraform.tfstate
          key: terraform-state-${{ github.ref }}
          restore-keys: |
            terraform-state-

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: ./terraform
        env:
          TF_VAR_do_token: ${{ secrets.DO_ACCESS_TOKEN }}
        run: terraform plan

      - name: Terraform Apply
        id: terraform
        working-directory: ./terraform
        env:
          TF_VAR_do_token: ${{ secrets.DO_ACCESS_TOKEN }}
        run: |
          terraform apply -auto-approve
          echo "cluster_id=$(terraform output -raw cluster_id)" >> $GITHUB_OUTPUT

  build-and-push:
    needs: provision-infrastructure
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=release-,enable=${{ github.ref == 'refs/heads/release' }}
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image tag output
        id: set_tag
        run: |
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${IMAGE_TAG}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Save kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ env.CLUSTER_NAME }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Create Docker registry secret
        run: |
          kubectl create namespace giropops-senhas --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry dockerhub-secret \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username=${{ secrets.DOCKER_USERNAME }} \
            --docker-password=${{ secrets.DOCKER_PASSWORD }} \
            --namespace=giropops-senhas \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        run: |
          IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          echo "Deploying image: ${IMAGE_TAG}"
          helm upgrade --install giropops-senhas ${{ env.HELM_CHART_PATH }} \
            --set deployments.giropops-senhas.image="${IMAGE_TAG}" \
            --namespace giropops-senhas \
            --create-namespace \
            --wait \
            --timeout 5m

      - name: Verify deployment
        run: |
          kubectl get pods -n giropops-senhas
          kubectl get svc -n giropops-senhas
