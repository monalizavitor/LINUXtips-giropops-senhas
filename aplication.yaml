apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: giropops
  namespace: argocd
spec:
  project: default
  destination:
    namespace: giropops
    server: 'https://kubernetes.default.svc'
  sources:
  - repoURL: 'https://github.com/monalizavitor/LINUXtips-giropops-senhas.git'
    chart: giropops-senhas
    targetRevision: 1.0.0
    helm:
      valueFiles: 
      - values.yaml
    path: helm
  - repoURL: 'https://github.com/monalizavitor/LINUXtips-giropops-senhas.git'
    targetRevision: feat/cd
    ref: helm
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    - CreateNamespace=true